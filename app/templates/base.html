<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Agent Replay Lab{% endblock %}</title>
  <style>
    /* Design system tokens */
    :root {
      --surface:        #FFFFFF;
      --surface-muted:  #F5F7FA;
      --text:           #172033;
      --text-muted:     #475467;
      --border:         #CBD5E1;
      --accent:         #175CD3;
      --focus:          #7C3AED;
      --observed:       #175CD3;
      --supported:      #067647;
      --warning:        #B54708;
      --failure:        #B42318;

      --font-sans: -apple-system, "Segoe UI", system-ui, sans-serif;
      --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;

      --sp-1:  4px;
      --sp-2:  8px;
      --sp-3: 12px;
      --sp-4: 16px;
      --sp-6: 24px;
      --sp-8: 32px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.6;
      background: var(--surface);
      color: var(--text);
    }

    a {
      color: var(--accent);
      text-decoration: underline;
    }
    a:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
      border-radius: 2px;
    }

    /* ── Skip link ── */
    .skip-link {
      position: absolute;
      top: -40px;
      left: 0;
      background: var(--accent);
      color: #fff;
      padding: var(--sp-2) var(--sp-4);
      z-index: 100;
      transition: top 0.1s;
    }
    .skip-link:focus { top: 0; }

    /* ── Navigation ── */
    nav {
      background: var(--surface-muted);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: var(--sp-3) var(--sp-4);
      display: flex;
      align-items: center;
      gap: var(--sp-6);
    }
    .nav-brand {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
    }
    .nav-brand:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
      border-radius: 2px;
    }
    .nav-links {
      display: flex;
      gap: var(--sp-4);
      list-style: none;
    }
    .nav-links a {
      font-size: 14px;
      color: var(--text-muted);
      text-decoration: none;
    }
    .nav-links a:hover { color: var(--text); }
    .nav-links a:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
      border-radius: 2px;
    }

    /* ── Main content ── */
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: var(--sp-8) var(--sp-4);
    }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--border);
      background: var(--surface-muted);
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      padding: var(--sp-4);
    }

    {% block extra_style %}{% endblock %}
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <nav aria-label="Primary navigation">
    <div class="nav-inner">
      <a href="/" class="nav-brand">Agent Replay Lab</a>
      <ul class="nav-links" role="list">
        <li><a href="/investigations/new">New Investigation</a></li>
        <li><a href="/docs">API docs</a></li>
        <li><a href="/health">Health</a></li>
      </ul>
      {% if mock_llm_mode is defined and mock_llm_mode %}
      <span style="margin-left:auto;font-size:12px;background:#fef3c7;color:#92400e;border:1px solid #fde68a;border-radius:3px;padding:2px 8px;font-family:var(--font-mono);">
        MOCK LLM MODE — set NEBIUS_API_KEY for live calls
      </span>
      {% endif %}
    </div>
  </nav>

  <main id="main-content" tabindex="-1">
    {% block content %}{% endblock %}
  </main>

  <footer>
    Agent Replay Lab — hackathon build &middot; version 0.1.0
  </footer>
</body>
</html>
