name: Real repair execution

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pinned-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: replay
          POSTGRES_PASSWORD: replay
          POSTGRES_DB: replay_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U replay -d replay_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      REPRODELTA_TEST_POSTGRES: postgresql://replay:replay@localhost:5432/replay_test
      NEBIUS_API_KEY: ""
      RUNNER_MODE: local
      INVESTIGATION_STORE: auto
      PERSIST_INVESTIGATIONS: "false"
      REPRODELTA_OLD_PYTHON: ${{ github.workspace }}/.repair-old/bin/python
      REPRODELTA_NEW_PYTHON: ${{ github.workspace }}/.repair-new/bin/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Provision controller and pinned NumPy environments
        run: |
          python -m pip install -e '.[dev]'
          python -m venv .repair-old
          python -m venv .repair-new
          .repair-old/bin/pip install numpy==1.26.4
          .repair-new/bin/pip install numpy==2.0.2
      - name: Verify all regressions, source review, actual repairs and isolation policy
        run: |
          python -m ruff check app runner fixture scripts tests
          python -m pytest tests -q
          node --test tests/frontend/*.cjs
